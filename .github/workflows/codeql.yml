name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (C#)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # No-build extraction reads the sources directly, so source-generated files under obj/ (System.Text.Json,
      # OpenAPI) are not analysed as if they were ours. Security queries only: style findings belong in the build.
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - "**/obj/**"
              - "**/bin/**"

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
