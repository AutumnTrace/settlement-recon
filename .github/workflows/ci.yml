name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: >
          dotnet test --no-build -c Release
          --filter "Category!=Integration"
          --logger "trx;LogFileName=unit.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults/unit

      - name: Integration tests (Testcontainers)
        run: >
          dotnet test --no-build -c Release
          --filter "Category=Integration"
          --logger "trx;LogFileName=integration.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults/integration

      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coverage
          reporttypes: MarkdownSummaryGithub;Cobertura
          assemblyfilters: -SettlementRecon.Tests

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage/SummaryGithub.md ]; then cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            coverage/

      - name: CLI smoke run (generated data)
        run: |
          dotnet run --project src/SettlementRecon.Cli -c Release --no-build -- generate --out data/ci --transactions 100000 --seed 42
          dotnet run --project src/SettlementRecon.Cli -c Release --no-build -- run \
            --ledger data/ci/ledger.csv \
            --settlement data/ci/orbit-2026-11-03.csv data/ci/canal-2026-11-03.csv data/ci/hashrail-2026-11-03.jsonl \
            --out out/ci
          cat out/ci/summary.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build image
        run: docker build -t settlement-recon:ci .

      - name: Smoke test the image
        run: |
          docker run -d --name recon -p 8080:8080 -e Demo__SeedSampleRun=true settlement-recon:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/ready > /dev/null; then break; fi
            sleep 1
          done
          for i in $(seq 1 30); do
            total=$(curl -fsS http://localhost:8080/api/runs | jq '.total')
            if [ "$total" = "1" ]; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/api/runs | jq '.items[0] | {runId, settlementLines, breaks, matchRate}'
          test "$total" = "1"
          docker logs recon | tail -5
