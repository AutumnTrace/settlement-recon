name: Feature request
description: A new settlement format, matching rule, report or API capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What reconciliation problem can't you solve today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: For a new format, include a few anonymised sample lines. For a new rule, describe when it should pair and what the reason should say.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
