version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      opentelemetry:
        patterns: ["OpenTelemetry*", "Azure.Monitor.*"]
      serilog:
        patterns: ["Serilog*"]
      mongodb:
        patterns: ["MongoDB.*", "Testcontainers*"]
      test:
        patterns: ["NUnit*", "FsCheck*", "coverlet.*", "Microsoft.NET.Test.Sdk"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
