version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      opentelemetry:
        patterns: ["OpenTelemetry*", "Azure.Monitor.*"]
      serilog:
        patterns: ["Serilog*"]
      mongodb:
        patterns: ["MongoDB.*", "Testcontainers*"]
      test:
        patterns: ["NUnit*", "FsCheck*", "coverlet.*", "Microsoft.NET.Test.Sdk"]
    ignore:
      # The service targets .NET 10 (LTS). ASP.NET Core packages of the next major only run on the next runtime;
      # moving to it is a deliberate upgrade, not a weekly bump.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Same reason: the SDK and runtime images stay on the 10.0 line until the project retargets.
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
