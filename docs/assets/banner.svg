<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">settlement-recon</title>
  <desc id="desc">Two columns of rows, ledger and PSP settlement, joined by lines: most pairs match, one is paired by amount and date, one is a break.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#121a36"/>
      <stop offset="1" stop-color="#1d1238"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- Title block -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="128" font-size="58" font-weight="700" fill="#f8fafc" letter-spacing="-1">settlement-recon</text>
    <rect x="74" y="146" width="132" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="192" font-size="22" fill="#cbd5e1">PSP settlement files against the ledger,</text>
    <text x="72" y="222" font-size="22" fill="#cbd5e1">millions of rows a minute, every mismatch explained.</text>
    <g font-size="14" fill="#94a3b8">
      <rect x="72" y="248" width="136" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="140" y="267" text-anchor="middle">Pipelines + spans</text>
      <rect x="218" y="248" width="92" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="264" y="267" text-anchor="middle">Channels</text>
      <rect x="320" y="248" width="92" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="366" y="267" text-anchor="middle">Hash join</text>
      <rect x="422" y="248" width="80" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="462" y="267" text-anchor="middle">.NET 10</text>
    </g>
  </g>

  <!-- Illustration: ledger rows (left) joined to settlement rows (right) -->
  <g transform="translate(800 52)">
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8" letter-spacing="2">
      <text x="0" y="0">LEDGER</text>
      <text x="268" y="0">PSP</text>
    </g>

    <!-- connectors -->
    <g fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M120 26 C 190 26, 200 26, 268 26" stroke="#5eead4" stroke-opacity="0.9"/>
      <path d="M120 62 C 190 62, 200 98, 268 98" stroke="#5eead4" stroke-opacity="0.9"/>
      <path d="M120 98 C 190 98, 200 62, 268 62" stroke="#5eead4" stroke-opacity="0.9"/>
      <path d="M120 134 C 190 134, 200 170, 268 170" stroke="#fbbf24" stroke-opacity="0.95" stroke-dasharray="6 6"/>
      <path d="M120 170 C 190 170, 200 134, 268 134" stroke="#5eead4" stroke-opacity="0.9"/>
      <path d="M120 206 C 160 206, 175 206, 194 206" stroke="#f87171" stroke-opacity="0.95"/>
    </g>

    <!-- break marker -->
    <g stroke="#f87171" stroke-width="2.5" stroke-linecap="round">
      <path d="M200 198 L 214 212"/>
      <path d="M214 198 L 200 212"/>
    </g>

    <!-- ledger rows -->
    <g>
      <rect x="0" y="16" width="120" height="20" rx="5" fill="#1e293b" stroke="#334155"/>
      <rect x="10" y="23" width="56" height="6" rx="3" fill="#64748b"/>
      <rect x="0" y="52" width="120" height="20" rx="5" fill="#1e293b" stroke="#334155"/>
      <rect x="10" y="59" width="72" height="6" rx="3" fill="#64748b"/>
      <rect x="0" y="88" width="120" height="20" rx="5" fill="#1e293b" stroke="#334155"/>
      <rect x="10" y="95" width="48" height="6" rx="3" fill="#64748b"/>
      <rect x="0" y="124" width="120" height="20" rx="5" fill="#1e293b" stroke="#334155"/>
      <rect x="10" y="131" width="64" height="6" rx="3" fill="#64748b"/>
      <rect x="0" y="160" width="120" height="20" rx="5" fill="#1e293b" stroke="#334155"/>
      <rect x="10" y="167" width="80" height="6" rx="3" fill="#64748b"/>
      <rect x="0" y="196" width="120" height="20" rx="5" fill="#1e293b" stroke="#7f1d1d"/>
      <rect x="10" y="203" width="60" height="6" rx="3" fill="#b91c1c"/>
    </g>

    <!-- settlement rows -->
    <g>
      <rect x="268" y="16" width="120" height="20" rx="5" fill="#1e293b" stroke="#334155"/>
      <rect x="278" y="23" width="56" height="6" rx="3" fill="#818cf8"/>
      <rect x="268" y="52" width="120" height="20" rx="5" fill="#1e293b" stroke="#334155"/>
      <rect x="278" y="59" width="48" height="6" rx="3" fill="#818cf8"/>
      <rect x="268" y="88" width="120" height="20" rx="5" fill="#1e293b" stroke="#334155"/>
      <rect x="278" y="95" width="72" height="6" rx="3" fill="#818cf8"/>
      <rect x="268" y="124" width="120" height="20" rx="5" fill="#1e293b" stroke="#334155"/>
      <rect x="278" y="131" width="80" height="6" rx="3" fill="#818cf8"/>
      <rect x="268" y="160" width="120" height="20" rx="5" fill="#1e293b" stroke="#78350f"/>
      <rect x="278" y="167" width="64" height="6" rx="3" fill="#f59e0b"/>
    </g>

    <!-- legend -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">
      <circle cx="4" cy="246" r="4" fill="#5eead4"/>
      <text x="14" y="250">matched</text>
      <circle cx="92" cy="246" r="4" fill="#fbbf24"/>
      <text x="102" y="250">amount + date</text>
      <circle cx="210" cy="246" r="4" fill="#f87171"/>
      <text x="220" y="250">missing at PSP</text>
    </g>
  </g>
</svg>
